name: Build iOS

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v2

    - name: Download Godot
      run: |
        wget https://github.com/godotengine/godot/releases/download/4.6.2-stable/Godot_v4.6.2-stable_macos.universal.zip
        unzip Godot_v4.6.2-stable_macos.universal.zip -d godot
        sudo mv godot/Godot.app /Applications/Godot.app
        sudo ln -s /Applications/Godot.app/Contents/MacOS/Godot /usr/local/bin/godot

    - name: Download Godot Export Templates
      run: |
        mkdir -p ~/Library/Application\ Support/Godot/export_templates/4.6.2.stable
        wget https://github.com/godotengine/godot/releases/download/4.6.2-stable/Godot_v4.6.2-stable_export_templates.tpz
        unzip Godot_v4.6.2-stable_export_templates.tpz -d templates_zip
        mv templates_zip/templates/* ~/Library/Application\ Support/Godot/export_templates/4.6.2.stable/
        ls ~/Library/Application\ Support/Godot/export_templates/4.6.2.stable/

    - name: Import all project resources
      # Godot 4.3+ supports --headless --import which fully imports every
      # resource (audio, textures, scenes) and writes compiled data to
      # .godot/imported/. This MUST run before --export-release otherwise
      # the .godot/ folder is empty (it is gitignored) and exported PCKs
      # contain broken / zero-byte audio and texture data.
      run: |
        godot --headless --import
        echo "Import completed. Imported files:"
        ls .godot/imported/ | wc -l

    - name: Create build directory
      run: mkdir -p build

    - name: Export iOS project
      run: godot --headless --export-release "iOS" build/your_project_name.xcodeproj

    - name: Set iOS Deployment Target
      run: sed -i '' 's/IPHONEOS_DEPLOYMENT_TARGET = 10.0;/IPHONEOS_DEPLOYMENT_TARGET = 12.0;/' build/your_project_name.xcodeproj/project.pbxproj

    - name: Build iOS project
      run: |
        xcodebuild \
          -project build/your_project_name.xcodeproj \
          -scheme your_project_name \
          -configuration Development \
          -archivePath build/your_project_name.xcarchive \
          archive \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO

    - name: Export IPA
      run: |
        mkdir -p build/Payload
        mv build/your_project_name.xcarchive/Products/Applications/your_project_name.app build/Payload/
        cd build
        zip -r App.ipa Payload/

    - name: Upload IPA to GitHub Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Ipa
        path: build/App.ipa
